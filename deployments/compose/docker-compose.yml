name: valorant-vod-coach

x-vodcoach-image: &vodcoach-image
  image: valorant-vod-coach:${APP_VERSION:-local}
  build:
    context: ../..
    dockerfile: Dockerfile

x-vodcoach-environment: &vodcoach-environment
  APP_ENV: compose
  SERVICE_VERSION: ${APP_VERSION:-local}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: json
  DATABASE_URL: postgres://${POSTGRES_USER:-vodcoach}:${POSTGRES_PASSWORD:-vodcoach}@postgres:5432/${POSTGRES_DB:-vodcoach}?sslmode=disable
  REDIS_URL: redis://redis:6379/0
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
  TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-valorant-vod-analysis}
  KAFKA_BROKERS: kafka:29092
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_DB: ${CLICKHOUSE_DB:-vodcoach}
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:-vodcoach}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-vodcoach}
  S3_ENDPOINT: http://minio:9000
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-vodcoach-artifacts}
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-vodcoach}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-vodcoach-local-password}
  S3_PREFIX: ${S3_PREFIX:-}
  S3_USE_PATH_STYLE: "true"
  AWS_EC2_METADATA_DISABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

services:
  vod-web:
    <<: *vodcoach-image
    command: ["/app/bin/vod-web", "--addr=:8090", "--static-dir=/app/web/app/dist"]
    restart: unless-stopped
    environment:
      <<: *vodcoach-environment
      VODCOACH_BOOTSTRAP_TOKEN: ${VODCOACH_BOOTSTRAP_TOKEN:-replace-with-a-random-bootstrap-token}
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      GRAFANA_PUBLIC_URL: ${GRAFANA_PUBLIC_URL:-http://localhost:3000}
      PROMETHEUS_PUBLIC_URL: ${PROMETHEUS_PUBLIC_URL:-http://localhost:9090}
      TEMPORAL_UI_PUBLIC_URL: ${TEMPORAL_UI_PUBLIC_URL:-http://localhost:8233}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9001}
      CLICKHOUSE_PUBLIC_URL: ${CLICKHOUSE_PUBLIC_URL:-http://localhost:8123}
      ALLOY_PUBLIC_URL: ${ALLOY_PUBLIC_URL:-http://localhost:12345}
    ports:
      - "8090:8090"
    labels:
      vodcoach.logs: enabled
    volumes:
      - app-raw:/app/data/raw
      - app-processed:/app/data/processed
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      temporal:
        condition: service_started
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8090/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  vod-worker:
    <<: *vodcoach-image
    command: ["/app/bin/vod-worker"]
    restart: unless-stopped
    environment:
      <<: *vodcoach-environment
    labels:
      vodcoach.logs: enabled
    volumes:
      - app-raw:/app/data/raw
      - app-processed:/app/data/processed
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      temporal:
        condition: service_started
      otel-collector:
        condition: service_started

  vod-outbox-relay:
    <<: *vodcoach-image
    command: ["/app/bin/vod-outbox-relay"]
    restart: unless-stopped
    environment:
      <<: *vodcoach-environment
    labels:
      vodcoach.logs: enabled
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started

  vod-clickhouse-sink:
    <<: *vodcoach-image
    command: ["/app/bin/vod-clickhouse-sink"]
    restart: unless-stopped
    environment:
      <<: *vodcoach-environment
    labels:
      vodcoach.logs: enabled
    depends_on:
      clickhouse:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vodcoach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vodcoach}
      POSTGRES_DB: ${POSTGRES_DB:-vodcoach}
    ports:
      - "5432:5432"
    labels:
      vodcoach.logs: enabled
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vodcoach} -d ${POSTGRES_DB:-vodcoach}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    labels:
      vodcoach.logs: enabled
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-vodcoach}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-vodcoach}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-vodcoach}
    ports:
      - "8123:8123"
      - "9000:9000"
    labels:
      vodcoach.logs: enabled
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse-init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.1
    ports:
      - "9092:9092"
    labels:
      vodcoach.logs: enabled
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,LOCAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,LOCAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,LOCAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 12

  kafka-init:
    image: apache/kafka:3.8.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command: |
      for topic in vod.lifecycle.v1 vod.processing.v1 vod.observation.v1 model.run.v1 manual.correction.v1 vod.dead-letter.v1; do
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --replication-factor 1 \
          --partitions 3 \
          --topic "$$topic"
      done

  minio:
    image: quay.io/minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vodcoach}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-vodcoach-local-password}
    ports:
      - "9002:9000"
      - "9001:9001"
    labels:
      vodcoach.logs: enabled
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER:-vodcoach}" "$${MINIO_ROOT_PASSWORD:-vodcoach-local-password}"; do
        sleep 2
      done
      mc mb --ignore-existing local/"$${S3_BUCKET:-vodcoach-artifacts}"
      mc anonymous set none local/"$${S3_BUCKET:-vodcoach-artifacts}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vodcoach}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-vodcoach-local-password}
      S3_BUCKET: ${S3_BUCKET:-vodcoach-artifacts}

  temporal:
    image: temporalio/auto-setup:1.29.7
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: ${POSTGRES_USER:-vodcoach}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-vodcoach}
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "7233:7233"
    labels:
      vodcoach.logs: enabled

  temporal-ui:
    image: temporalio/ui:2.49.1
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8233:8080"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    labels:
      vodcoach.logs: enabled
    volumes:
      - ./otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - prometheus
      - loki
      - tempo

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
      - prometheus-data:/prometheus

  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/local-config.yml"]
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yml:ro
      - loki-data:/loki

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yml"]
    ports:
      - "3200:3200"
    volumes:
      - ./tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/tmp/tempo

  alloy:
    image: grafana/alloy:v1.18.0
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    ports:
      - "12345:12345"
    volumes:
      - ./alloy.config:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:13.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource@4.19.0
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
      - tempo
      - clickhouse

volumes:
  app-raw:
  app-processed:
  postgres-data:
  redis-data:
  clickhouse-data:
  kafka-data:
  minio-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
