version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web/app
    schedule: { interval: weekly }
    groups:
      web-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /ml/vision-service
    schedule: { interval: weekly }
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
